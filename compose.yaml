services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
        - codeberg_token
    image: localhost/kylehub-website:latest
    container_name: kylehub-website
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - website-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  newt:
    image: docker.io/fosrl/newt:latest
    container_name: kylehub-website-newt
    restart: unless-stopped
    environment:
      - PANGOLIN_ENDPOINT=${PANGOLIN_ENDPOINT}
      - NEWT_ID=${NEWT_ID}
      - NEWT_SECRET=${NEWT_SECRET}
    depends_on:
      website:
        condition: service_healthy
    networks:
      - website-internal
      - newt-egress

networks:
  website-internal:
    driver: bridge
    internal: true
  newt-egress:
    driver: bridge

secrets:
  # Build-time only: read from host/.env variables and discarded after the
  # build step. Never present in the final image or runtime.
  github_token:
    environment: GITHUB_TOKEN
  codeberg_token:
    environment: CODEBERG_TOKEN
